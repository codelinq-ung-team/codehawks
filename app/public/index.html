<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Codelinq Hackathon</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111827; color: #f9fafb; }
      main { width: min(42rem, calc(100% - 3rem)); }
      p { color: #9ca3af; line-height: 1.6; }
      .label { color: #34d399; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .6rem 0; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -.06em; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">CodeHawks · Hackathon</div>
      <h1>Codelinq</h1>
      <p>The hackathon site is ready for the team’s app. Replace this starter page from <code>app/public/</code>.</p>
    </main>
  </body>
</html>

name: Deploy hackathon
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify GitHub OIDC access without creating app resources
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hackathon-aws
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: hackathon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: cfn-lint infra/app.json && python scripts/validate_repo.py
      - name: Validate Bedrock settings
        if: inputs.verify_only != true
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_MODEL_ARNS: ${{ vars.BEDROCK_MODEL_ARNS }}
        run: python scripts/bedrock_config.py
      - name: Require Cloudflare DNS credential for a site deployment
        if: inputs.verify_only != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.verify_only != true
        with:
          node-version: '24'
      - name: Build app when a build adapter has been added
        if: inputs.verify_only != true
        run: |
          if [ -f scripts/build-app.sh ]; then
            bash scripts/build-app.sh
          fi
      - name: Package streaming backend
        if: inputs.verify_only != true
        run: python scripts/build_backend.py
      - name: Inspect GitHub OIDC claim values without printing the token
        if: inputs.verify_only == true
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          separator = "&" if "?" in os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] else "?"
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + separator + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          allowed = ("iss", "sub", "aud", "repository", "repository_id", "repository_owner", "repository_owner_id", "ref", "workflow_ref")
          print(json.dumps({key: claims.get(key) for key in allowed}, indent=2))
          PY
      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: hackathon-${{ github.run_id }}
      - name: Verify or deploy
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_MODEL_ARNS: ${{ vars.BEDROCK_MODEL_ARNS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_VOICE_TOKEN }} # optional; turns on Abe's voice in the Quest app
        run: |
          if [ "$VERIFY_ONLY" = true ]; then
            python scripts/aws_actions.py verify-deploy
          else
            python scripts/aws_actions.py deploy
          fi
      - name: Publish app when a publishing adapter has been added
        if: inputs.verify_only != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f scripts/publish-app.sh ]; then
            bash scripts/publish-app.sh
          fi
      - name: Verify deployed site and backend (three small Bedrock requests)
        if: inputs.verify_only != true
        run: python scripts/smoke_backend.py
      - name: Report app resource failures
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name codelinc-hackathon-app \
            --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].{Resource:LogicalResourceId,Type:ResourceType,Status:ResourceStatus,Reason:ResourceStatusReason}' \
            --output json --no-cli-pager

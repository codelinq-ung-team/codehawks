name: Validate IaC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: cfn-lint infra/bootstrap.json infra/app.json
      - run: python scripts/validate_repo.py
      - run: python scripts/check_branding.py
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Build the site (LincLife and Advisor3D)
        run: bash scripts/build-app.sh
      - name: Test the LincLife chat script and calculator
        run: npm test
        working-directory: codelinc_frontend
      - name: Test the legacy-domain redirect
        run: node --test scripts/tests/legacy_redirect.test.cjs

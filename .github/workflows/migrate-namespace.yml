name: Migrate hackathon namespace
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run phases in the order documented in docs/rename-migration.md
        type: choice
        required: true
        options: [inventory, prepare, create-bootstrap, cutover, rollback, cleanup]
      confirmation:
        description: Cleanup only — DELETE LEGACY codelinq-hackathon 394270749442
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: hackathon-aws
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.phase == 'cleanup' && 'hackathon-teardown' || 'hackathon-admin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: cfn-lint infra/bootstrap.json infra/app.json && python scripts/validate_repo.py
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.LEGACY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: hackathon-migration-${{ github.run_id }}
      - name: Run the selected migration phase
        env:
          MIGRATION_PHASE: ${{ inputs.phase }}
          MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_MODEL_ARNS: ${{ vars.BEDROCK_MODEL_ARNS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/migrate_namespace.py "$MIGRATION_PHASE" --confirm "$MIGRATION_CONFIRMATION"
      - name: Preserve inventory and deployed templates for the handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rename-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/rename-manifest.json
            build/legacy-*-before.json
          if-no-files-found: ignore
          retention-days: 30

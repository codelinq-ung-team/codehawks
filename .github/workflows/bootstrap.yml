name: Update hackathon AWS bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hackathon-bootstrap
  cancel-in-progress: false
jobs:
  update-bootstrap:
    if: github.ref == 'refs/heads/main'
    environment: hackathon-admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: cfn-lint infra/bootstrap.json infra/app.json && python scripts/validate_repo.py
      - name: Validate Bedrock settings
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_MODEL_ARNS: ${{ vars.BEDROCK_MODEL_ARNS }}
        run: python scripts/bedrock_config.py
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: hackathon-bootstrap-${{ github.run_id }}
      - run: python scripts/aws_actions.py update-bootstrap
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_MODEL_ARNS: ${{ vars.BEDROCK_MODEL_ARNS }}
